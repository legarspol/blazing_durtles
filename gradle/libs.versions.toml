# Gradle Version Catalog — single source of truth for dependency & plugin versions.
# Auto-detected by Gradle from gradle/libs.versions.toml; referenced as libs.* in build files.
# See docs/GRADLE_REVIEW.md for the per-dependency disposition (keep / bump / remove) that
# tracks the migration plan — this file only records *current* pins, verbatim.

[versions]
# Build toolchain
agp = "9.2.1"
kotlin = "2.0.21"          # AGP 9 built-in Kotlin; also the Compose Compiler + serialization plugin version
hilt = "2.60.1"
ksp = "2.0.21-1.0.25"
googleServices = "4.5.0"
firebaseCrashlyticsPlugin = "3.0.7"

# :core — pure Kotlin/JVM
javaxInject = "1"
kotlinxDatetime = "0.6.1"
# 1.9.x is the last line built against Kotlin 2.0; 1.10+ pulls a 2.1 stdlib.
kotlinxCoroutines = "1.9.0"

# AndroidX — UI / lifecycle (legacy View stack, slated for Compose in Phase 4)
# activity 1.9+ is required by activity-compose under Compose BOM 2024.09, and enableEdgeToEdge()
# arrived in 1.8. The ref is shared with activity-ktx, so this bump reaches every legacy Activity.
activity = "1.9.3"
fragment = "1.3.6"
appcompat = "1.6.1"
constraintlayout = "2.1.4"
recyclerview = "1.3.2"
preference = "1.2.1"
legacySupportCoreUtils = "1.0.0"
annotation = "1.7.1"

# Compose (individual library versions come from the BOM)
composeBom = "2024.09.03"

# AndroidX — platform / data
room = "2.6.1"
work = "2.9.0"
securityCrypto = "1.1.0-alpha06"
datastore = "1.1.1"

# Third-party (several are migration targets — see review doc)
desugarJdkLibs = "2.0.4"
jacksonDatabind = "2.15.0"
gson = "2.10.1"
okhttp = "5.0.0-alpha.6"
jsoup = "1.16.1"
lottie = "5.0.3"
pikolo = "2.0.2"

# Migration targets — replacing Jackson/OkHttp/SharedPreferences (Phase 2)
kotlinxSerialization = "1.7.3"
ktor = "2.3.12"

# Firebase (individual library versions come from the BOM)
firebaseBom = "34.15.0"

# Test
junit = "4.13.2"
androidxTestRunner = "1.5.2"
androidxTestCore = "1.5.0"
androidxTestRules = "1.5.0"
androidxTestExtJunit = "1.1.5"

[libraries]
# AndroidX — UI / lifecycle
androidx-activity-ktx = { module = "androidx.activity:activity-ktx", version.ref = "activity" }
androidx-fragment-ktx = { module = "androidx.fragment:fragment-ktx", version.ref = "fragment" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "constraintlayout" }
androidx-recyclerview = { module = "androidx.recyclerview:recyclerview", version.ref = "recyclerview" }
androidx-preference = { module = "androidx.preference:preference", version.ref = "preference" }
androidx-legacy-support-core-utils = { module = "androidx.legacy:legacy-support-core-utils", version.ref = "legacySupportCoreUtils" }
androidx-annotation = { module = "androidx.annotation:annotation", version.ref = "annotation" }

# Compose — versions supplied by the BOM (imported as a platform in :app)
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }

# AndroidX — platform / data
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
androidx-work-runtime = { module = "androidx.work:work-runtime", version.ref = "work" }
androidx-security-crypto = { module = "androidx.security:security-crypto", version.ref = "securityCrypto" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }

# Third-party
desugar-jdk-libs = { module = "com.android.tools:desugar_jdk_libs", version.ref = "desugarJdkLibs" }
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-compiler", version.ref = "hilt" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jacksonDatabind" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-urlconnection = { module = "com.squareup.okhttp3:okhttp-urlconnection", version.ref = "okhttp" }
jsoup = { module = "org.jsoup:jsoup", version.ref = "jsoup" }
lottie = { module = "com.airbnb.android:lottie", version.ref = "lottie" }
pikolo = { module = "com.github.madrapps:pikolo", version.ref = "pikolo" }

# Migration targets — Ktor + kotlinx.serialization (Phase 2)
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }

# Firebase — versions supplied by the BOM (imported as a platform in :app)
firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebaseBom" }
firebase-analytics = { module = "com.google.firebase:firebase-analytics" }
firebase-crashlytics = { module = "com.google.firebase:firebase-crashlytics" }

# :core — pure Kotlin/JVM
javax-inject = { module = "javax.inject:javax.inject", version.ref = "javaxInject" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinxDatetime" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }

# Test
junit = { module = "junit:junit", version.ref = "junit" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidxTestCore" }
androidx-test-rules = { module = "androidx.test:rules", version.ref = "androidxTestRules" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExtJunit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm" }
hilt-android = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
google-services = { id = "com.google.gms.google-services", version.ref = "googleServices" }
firebase-crashlytics = { id = "com.google.firebase.crashlytics", version.ref = "firebaseCrashlyticsPlugin" }
